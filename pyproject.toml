[build-system]
requires      = [ "setuptools", "wheel", "ninja", "packaging", "torch" ]
build-backend = "setuptools.build_meta"

[project]
name = "causal-conv1d"
version = "1.6.2.post2"
requires-python = "==3.12.*"
dynamic = [
    "dependencies",
    "classifiers",
    "description",
    "readme",
    "authors",
    "license",
]

[dependency-groups]
dev = [
    "flash-attn",
    "ninja>=1.13.0",
    "packaging>=26.2",
    "setuptools<=68",
    "wheel<=38",
    "triton-windows",
    "torch",
    "torchvision",
]

[tool.uv]
no-build-isolation-package = [ "flash-attn", "causal-conv1d" ]

[tool.uv.sources]
flash-attn  = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.25/flash_attn-2.8.3+cu132torch2.12-cp312-cp312-win_amd64.whl" }
torch       = { url = "https://download-r2.pytorch.org/whl/cu132/torch-2.12.0%2Bcu132-cp312-cp312-win_amd64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cu132/torchvision-0.27.0%2Bcu132-cp312-cp312-win_amd64.whl" }

[tool.uv.extra-build-variables]
Causal_conv1d = { 
     DISTUTILS_USE_SDK="1", 
MAX_JOBS="4", 
CUDA_HOME="'C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.2'", 
TORCH_CUDA_ARCH_LIST="8.6", 
FORCE_BUILD="TRUE", 
FORCE_CXX11_ABI="TRUE",
cuda_dir="C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.2"}
